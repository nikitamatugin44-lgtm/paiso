name: Build Physics Debugger

on:
push:
pull_request:
workflow_dispatch:

jobs:
build:
name: Build (${{ matrix.target }})
runs-on: ubuntu-latest
strategy:
fail-fast: false
matrix:
target:
- Win64
- MacOS
- Android32
- Android64

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Build Geode mod
    uses: geode-sdk/build-geode-mod@main
    with:
      target: ${{ matrix.target }}
      combine: true
